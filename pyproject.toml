[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeturnus-self-healing-machines"
version = "1.0.0"
description = "AETURNUS Turbofan Predictive Maintenance & Self-Healing Engine Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "AETURNUS Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi[standard]>=0.115.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "pyarrow>=18.0.0",
    "pyyaml>=6.0.0",
    "joblib>=1.4.0",
    "websockets>=13.0",
    "requests>=2.32.0",
    "mlflow>=2.18.0",
    "reportlab>=4.2.0",
    "matplotlib>=3.9.0",
    "lightgbm>=4.5.0",
    "shap>=0.46.0",
    "optuna>=4.0.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

