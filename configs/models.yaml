# configs/models.yaml
default_algorithm: "lightgbm"

algorithms:
  FD001: "lightgbm"
  FD002: "lightgbm"
  FD003: "lightgbm"
  FD004: "lightgbm"

baselines:
  ridge:
    alpha: 1.0
  hist_gb:
    max_iter: 150
    learning_rate: 0.05
    max_leaf_nodes: 31
    min_samples_leaf: 20
    random_state: 42
  lightgbm:
    n_estimators: 150
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    random_state: 42

anomaly_detector:
  model_type: "isolation_forest"
  contamination: 0.05
  healthy_cycle_fraction: 0.40
  n_estimators: 100
  random_state: 42
  score_threshold: 0.80

rul_regressor:
  model_type: "lightgbm"
  quantiles: [0.1, 0.5, 0.9]
  n_estimators: 150
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  random_state: 42

classifier:
  target_threshold_cycles: 30
  horizons: [10, 30, 60]
  target_recall: 0.90
  model_type: "lightgbm_classifier"
  n_estimators: 120
  learning_rate: 0.05
  probability_threshold: 0.70
  random_state: 42
