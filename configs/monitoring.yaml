# configs/monitoring.yaml
drift:
  psi_threshold: 0.20
  ks_pvalue_threshold: 0.05
  drifting_features_ratio_threshold: 0.30
  reference_sample_size: 2000

retraining:
  volume_labeled_engines_threshold: 20
  rmse_degradation_threshold_ratio: 0.15
  auto_trigger_enabled: true

promotion_gate:
  rmse_min_improvement_pct: 2.0
  nasa_score_max_degradation_pct: 5.0
  late_prediction_max_increase_pp: 3.0

alerts:
  drift_psi_threshold: 0.25
  key_drift_sensors: ["s3", "s7", "s11"]
  backlog_critical_high_threshold: 10
  coverage_min_threshold: 0.75
  latency_p95_ms_threshold: 100.0

  # External Alert Webhook Dispatcher (Slack / Teams / PagerDuty / Generic)
  webhook:
    enabled: false
    url: "" # e.g. https://hooks.slack.com/services/... or https://events.pagerduty.com/v2/enqueue
    service: "slack" # "slack" | "teams" | "pagerduty" | "generic"
    timeout_sec: 5.0
    retry_count: 2
    notify_rules: ["M1", "M2", "M3"]

