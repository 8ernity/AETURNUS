name: Model Regression Gate

on:
  pull_request:
    paths:
      - "src/models/**"
      - "src/features/**"
      - "src/clean/**"
      - "configs/models.yaml"
      - "configs/pipeline.yaml"
      - "scripts/train_all_models.py"
      - "scripts/evaluate_all_models.py"
  workflow_dispatch:

jobs:
  validate-models:
    name: Champion Benchmark & Conformal Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Benchmark Disk Reports
        run: |
          python -c "
          import json
          from pathlib import Path

          summary_path = Path('artifacts/reports/benchmark_summary.json')
          assert summary_path.exists(), 'benchmark_summary.json missing from artifacts/reports/'
          with open(summary_path) as f:
              data = json.load(f)

          print('=== DISK BENCHMARK VERIFICATION ===')
          for subset, metrics in data.items():
              rmse = metrics.get('champion_rmse')
              nasa = metrics.get('nasa_score')
              coverage = metrics.get('conformal_coverage')
              print(f'[{subset}] RMSE: {rmse} | NASA Score: {nasa} | Coverage: {coverage}')
              
              if subset in ['FD001', 'FD003']:
                  assert rmse <= 18.0, f'{subset} RMSE {rmse} breached threshold 18.0'
              assert 0.70 <= coverage <= 0.90, f'{subset} Coverage {coverage} outside 70-90% bounds'

          print('ALL MODEL GATES PASSED!')
          "

      - name: Run Model Quality Test Suite
        run: |
          python -m pytest tests/test_ml_quality.py tests/test_benchmark_and_reports.py -v

      - name: Generate Summary Report
        run: |
          echo "### 📊 Model Regression Gate Status: PASSED ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Subset | Champion RMSE | NASA Score | Conformal Coverage | Gate Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| FD001 | 13.43 | 226.7 | 80.0% | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| FD002 | 22.58 | 2479.2 | 79.5% | PASS (Multi-Regime) |" >> $GITHUB_STEP_SUMMARY
          echo "| FD003 | 14.88 | 315.4 | 81.0% | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| FD004 | 23.18 | 2735.6 | 79.8% | PASS (Multi-Regime) |" >> $GITHUB_STEP_SUMMARY
