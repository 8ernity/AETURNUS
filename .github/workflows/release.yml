name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Clean Source Archive (tracked files only)
        run: |
          git archive --format=zip --prefix=AETURNUS/ -o AETURNUS_source.zip HEAD
          python - <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile('AETURNUS_source.zip').namelist()
          bad = [n for n in names if n.endswith(('.db', '.db-wal', '.db-shm', '.db-journal'))]
          if bad:
              sys.exit(f'Archive contains DB state: {bad}')
          print(f'Archived {len(names)} tracked files; no DB state.')
          PY

      - name: Generate SHA-256 Checksums
        run: |
          sha256sum AETURNUS_source.zip > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "⚡ AETURNUS Release ${{ github.ref_name || inputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            AETURNUS_source.zip
            CHECKSUMS.txt
