services:
  - type: web
    name: aeturnus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m scripts.build_all_data FD001
    startCommand: python run_app.py
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Do not warm FD001 in the background on a 512 MB instance. The first
      # /fleet request loads one subset lazily and the single-subset cache keeps
      # only that frame resident.
      - key: AETURNUS_WARM_SUBSETS
        value: none
      - key: AETURNUS_BOOTSTRAP_TRIAGE
        value: "0"
      # Set these to strong random strings in the Render dashboard. They are
      # operator-owned secrets, not values generated by the application.
      - key: AETURNUS_API_KEY_ADMIN
        sync: false
      - key: AETURNUS_API_KEY_OPERATOR
        sync: false
      - key: AETURNUS_API_KEY_TECHNICIAN
        sync: false
      - key: AETURNUS_API_KEY_VIEWER
        sync: false
